name: E2E

# Deterministic Playwright only. No LLM in the hot path — that is the cost
# control. AI runs when authoring a bolt and when healing, and both produce
# reviewable PRs, never a CI-time code change.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      grep:
        description: 'Tag filter, e.g. @smoke'
        required: false
        default: ''

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium

      # The seed test gates everything. If it fails, every downstream failure
      # is noise and triaging them wastes the team's time.
      - name: Seed test
        run: npx playwright test tests/seed.spec.ts
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - name: Run suite
        run: npx playwright test ${{ github.event.inputs.grep && format('--grep {0}', github.event.inputs.grep) || '' }}
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          E2E_USER: ${{ secrets.E2E_USER }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  # The parts of the review checklist a machine can enforce, so they stop
  # depending on whether anyone remembered to run it.
  lint-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No committed secrets
        run: |
          if git ls-files | grep -E '\.env(\.|$)|storageState|\.auth/'; then
            echo "::error::Credential file tracked by git."
            exit 1
          fi

      - name: No fixed sleeps
        run: |
          if grep -rn "waitForTimeout" {{TESTS_DIR}}/ 2>/dev/null; then
            echo "::error::waitForTimeout is banned — wait for an observable condition."
            exit 1
          fi

      - name: No brittle selectors
        run: |
          if grep -rnE "locator\(['\"](//|\.css-|\.[a-z]+-[0-9a-f]{6,})" {{TESTS_DIR}}/ 2>/dev/null; then
            echo "::error::Brittle selector. See knowledge/org/locator-policy.md"
            exit 1
          fi

      - name: Traceability headers
        run: |
          fail=0
          for f in $(find {{TESTS_DIR}} -name '*.spec.ts' 2>/dev/null); do
            head -6 "$f" | grep -q "// spec:" || { echo "::error file=$f::missing // spec: header"; fail=1; }
          done
          exit $fail

      - name: Unexplained skips
        run: |
          grep -rnE "test\.(skip|fixme)\(" {{TESTS_DIR}}/ 2>/dev/null | grep -v "//" \
            && echo "::warning::skip/fixme without an adjacent reason comment" || true
